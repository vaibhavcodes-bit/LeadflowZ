services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U leadflow -d leadflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile

    container_name: leadflow-backend
    restart: unless-stopped

    environment:
      APP_NAME: LeadFlow
      APP_ENV: production
      API_PREFIX: /api

      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow_dev_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      DATABASE_URL: postgresql+psycopg://leadflow:leadflow_dev_password@postgres:5432/leadflow

      WEBHOOK_SECRET: change-me-in-development

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile

    container_name: leadflow-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data:
